<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outbreak</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --bg: #0b121a; --panel: #111b26; --panel2: #162230; --line: #243446; --text: #cdd7e2; --mut: #7d8c9d;
    --red: #d4343e; --blue: #3d7fe0; --green: #3f9f6f; --gold: #d9a93a; --amber: #d88a2a;
    --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --bar: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--body); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .num { font-family: var(--cond); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- map ---------- */
  #map { position: absolute; inset: 0; }
  .leaflet-container { background: #0c1722; cursor: default; font-family: var(--body); }
  .leaflet-interactive { cursor: pointer; }
  .leaflet-bottom { bottom: var(--bar); transition: bottom .25s; }
  body.collapsed .leaflet-bottom { bottom: 0; }
  .leaflet-control-zoom { border: 1px solid var(--line) !important; border-radius: 3px !important; }
  .leaflet-control-zoom a { background: var(--panel); color: var(--text); border-color: var(--line); border-radius: 0 !important; }
  .leaflet-control-zoom a:hover { background: var(--panel2); }
  .leaflet-control-attribution { background: rgba(11,18,26,.7) !important; color: var(--mut) !important; }
  .leaflet-control-attribution a { color: var(--mut) !important; }
  .tr { width: 14px; height: 14px; color: #dbe6f2; opacity: .9; }
  .tr svg { width: 14px; height: 14px; display: block; }
  .tr.sea { color: #7fc4e6; }
  .tr.closed { opacity: .28; }
  .z-s .tr { width: 11px; height: 11px; } .z-s .tr svg { width: 11px; height: 11px; }
  .mv { width: 18px; height: 18px; color: #fff; filter: drop-shadow(0 1px 2px #000); }
  .mv svg { width: 18px; height: 18px; display: block; transition: transform .1s linear; }
  .mv.sea { color: #9fd8f2; }
  .ring { width: 10px; height: 10px; border: 1.5px solid var(--red); border-radius: 50%; animation: ring .9s ease-out forwards; }
  .ring.stop { border-color: var(--amber); }
  @keyframes ring { from { transform: scale(.3); opacity: 1; } to { transform: scale(4); opacity: 0; } }

  /* ---------- top: date + speed ---------- */
  #top { position: fixed; top: 10px; left: 58px; z-index: 1000; display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  #date { padding: 6px 14px 6px 12px; min-width: 150px; border-right: 1px solid var(--line); }
  #date b { display: block; font: 600 20px/1.1 var(--cond); letter-spacing: .03em; color: #fff; text-transform: uppercase; }
  #date span { font-size: 12px; color: var(--mut); }
  #speed { display: flex; align-items: center; padding: 0 4px; gap: 2px; }
  #speed button { width: 34px; height: 34px; display: grid; place-items: center; background: none; border: 0; border-radius: 3px; color: var(--mut); cursor: pointer; }
  #speed button:hover { color: #fff; background: var(--panel2); }
  #speed button.on { color: #fff; background: var(--blue); }
  #speed svg { width: 16px; height: 16px; fill: currentColor; }

  /* ---------- news banner ---------- */
  #banner { position: fixed; top: 10px; left: 50%; z-index: 1000; transform: translate(-50%, -140%); transition: transform .35s; max-width: min(620px, calc(100vw - 560px)); min-width: 280px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 3px; padding: 7px 14px; cursor: pointer; }
  #banner.on { transform: translate(-50%, 0); }
  #banner small { display: block; font: 600 11px var(--cond); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  #banner span { display: block; color: #fff; }

  /* ---------- bottom bar ---------- */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100; transition: transform .25s; }
  body.collapsed #dock { transform: translateY(100%); }
  #dock-toggle { position: absolute; left: 50%; top: -20px; transform: translateX(-50%); width: 64px; height: 20px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; color: var(--mut); cursor: pointer; padding: 0; }
  #dock-toggle:hover { color: #fff; }
  #dock-toggle svg { width: 14px; height: 8px; transition: transform .25s; } body.collapsed #dock-toggle svg { transform: rotate(180deg); }
  #bar { height: var(--bar); display: flex; align-items: center; gap: 22px; padding: 0 16px; background: var(--panel); border-top: 1px solid var(--line); }
  .st { min-width: 0; } .st label { display: block; font: 600 11px var(--cond); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .st .v { font: 600 20px/1.1 var(--cond); color: #fff; white-space: nowrap; }
  .st .s { font-size: 11.5px; color: var(--mut); white-space: nowrap; }
  .st.gold .v { color: var(--gold); }
  .meter { width: 90px; height: 3px; background: #223243; margin-top: 4px; } .meter i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
  .sep { width: 1px; align-self: stretch; margin: 12px 0; background: var(--line); }
  .grow { flex: 1; }
  .btn { height: 34px; padding: 0 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; font: 600 13px var(--cond); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #1c2b3b; border-color: #34495f; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.on { border-color: var(--red); color: #ff9aa0; }
  .btn.red { background: #5a1d23; border-color: var(--red); color: #fff; } .btn.red:hover { background: #75242c; }
  .btn.blue { background: #1c3f73; border-color: var(--blue); color: #fff; } .btn.blue:hover { background: #24508f; }
  .btn.gold { border-color: #6b5420; color: var(--gold); }
  .btn .dot { display: inline-block; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 6px; border-radius: 8px; background: var(--red); color: #fff; font-size: 11px; line-height: 16px; text-align: center; vertical-align: 1px; }
  body.busy #bar .btn, body.busy #drawer .btn { pointer-events: none; opacity: .6; }

  /* ---------- drawer ---------- */
  #drawer { position: fixed; top: 0; right: 0; bottom: var(--bar); width: min(420px, 100vw); z-index: 1050; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(102%); transition: transform .25s; }
  body.collapsed #drawer { bottom: 0; }
  #drawer.open { transform: none; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; padding: 11px 0; background: none; border: 0; border-bottom: 2px solid transparent; font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); cursor: pointer; }
  .tabs button.on { color: #fff; border-bottom-color: var(--red); }
  .tabs .x { flex: 0 0 44px; font-size: 20px; }
  .pane { flex: 1; overflow-y: auto; padding: 12px 14px 18px; }
  .pane h4 { margin: 14px 0 6px; font: 600 12px var(--cond); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .news-day { margin: 14px 0 4px; font: 600 12px var(--cond); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .news-item { padding: 5px 0 5px 10px; border-left: 2px solid var(--line); margin-bottom: 3px; color: #b9c6d4; }
  .news-item.imp { border-left-color: var(--red); color: #fff; }
  .news-item.dip { border-left-color: var(--blue); }
  .row { padding: 8px 0; border-bottom: 1px solid #1b2a3a; cursor: pointer; }
  .row:hover { background: #142030; }
  .row .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .l1 b { font-weight: 500; color: #fff; }
  .row .l2 { display: flex; gap: 10px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--mut); }
  .rel { position: relative; flex: 1; height: 4px; background: #223243; } .rel i { position: absolute; top: 0; bottom: 0; }
  .tag { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: 2px; font: 600 11px/16px var(--cond); letter-spacing: .06em; text-transform: uppercase; background: #223243; color: #a9bacb; }
  .tag.war { background: #5a1d23; color: #ffb3b8; } .tag.ally { background: #1f4a37; color: #a6e3c3; } .tag.trade { background: #1c3f73; color: #b9d3ff; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 2px; }
  .acts .btn { height: 28px; font-size: 12px; }
  input[type=search], select { width: 100%; height: 34px; padding: 0 10px; background: #0d1721; color: #fff; border: 1px solid var(--line); border-radius: 3px; font: inherit; }
  .chips { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
  .chips button { height: 26px; padding: 0 10px; background: none; border: 1px solid var(--line); border-radius: 13px; color: var(--mut); cursor: pointer; font-size: 12px; }
  .chips button.on { color: #fff; border-color: var(--blue); background: #172a45; }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1b2a3a; color: var(--mut); } .kv b { color: #fff; font-weight: 500; }
  .bar2 { height: 4px; background: #223243; margin-top: 3px; } .bar2 i { display: block; height: 100%; background: var(--red); }

  /* ---------- modal: upgrades / menu / end ---------- */
  .ov { position: fixed; inset: 0; z-index: 1300; display: grid; place-items: center; padding: 16px; background: rgba(4,8,12,.72); opacity: 0; visibility: hidden; transition: opacity .15s; }
  .ov.open { opacity: 1; visibility: visible; }
  .sheet { width: min(940px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .sh-head h2 { margin: 0; font: 700 22px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: #fff; }
  .x-btn { background: none; border: 0; font-size: 24px; line-height: 1; color: var(--mut); cursor: pointer; padding: 0 6px; } .x-btn:hover { color: #fff; }
  .upg { display: grid; grid-template-columns: 1.15fr 1fr; min-height: 0; overflow: auto; }
  .tracks { padding: 8px 18px 16px; border-right: 1px solid var(--line); }
  .track { padding: 12px 0; border-bottom: 1px solid #1b2a3a; }
  .track h3 { margin: 0; font: 600 16px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: #fff; display: flex; justify-content: space-between; }
  .track h3 em { font-style: normal; font-size: 13px; color: var(--mut); }
  .track p { margin: 2px 0 8px; font-size: 12px; color: var(--mut); }
  .nodes { display: flex; align-items: center; }
  .node { width: 38px; height: 38px; display: grid; place-items: center; background: #0d1721; border: 1px solid #2c4057; color: var(--mut); font: 600 15px var(--cond); cursor: pointer; border-radius: 3px; }
  .node.built { background: var(--blue); border-color: var(--blue); color: #fff; }
  .node.next { border-color: var(--gold); color: var(--gold); }
  .node.sel { box-shadow: 0 0 0 2px #fff; }
  .link { width: 14px; height: 2px; background: #2c4057; } .link.built { background: var(--blue); }
  .detail { padding: 18px; }
  .detail h3 { margin: 0 0 4px; font: 700 22px var(--cond); color: #fff; }
  .detail .meta { color: var(--mut); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-family: var(--cond); font-weight: 600; }
  .detail p { margin: 10px 0 14px; color: #b9c6d4; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .seg button { flex: 1; height: 30px; background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; color: var(--mut); font: 600 12px var(--cond); letter-spacing: .08em; text-transform: uppercase; }
  .seg button:last-child { border-right: 0; } .seg button.on { background: var(--blue); color: #fff; }
  .hint { font-size: 12px; color: var(--mut); min-height: 16px; }

  #menu { z-index: 2000; background: #070d13; }
  #menu.hidden { display: grid !important; opacity: 0; visibility: hidden; pointer-events: none; }
  .menu { width: min(720px, 100%); }
  .menu h1 { margin: 0 0 2px; font: 700 54px/1 var(--cond); letter-spacing: .3em; color: var(--red); }
  .menu .tag2 { margin: 0 0 22px; color: var(--mut); }
  .menu .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .menu h2 { margin: 0 0 8px; font: 600 12px var(--cond); letter-spacing: .12em; color: var(--mut); text-transform: uppercase; }
  #sel-country { width: 100%; height: 240px; margin-top: 8px; padding: 2px; background: #0d1721; color: #fff; border: 1px solid var(--line); border-radius: 3px; font: inherit; }
  #sel-country option { padding: 5px 8px; } #sel-country option:checked { background: var(--blue) linear-gradient(0deg, var(--blue), var(--blue)); }
  .dopt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  .dopt:hover { background: var(--panel); } .dopt[aria-pressed=true] { border-color: var(--red); background: #1d1519; }
  .dopt b { font: 600 17px var(--cond); letter-spacing: .05em; text-transform: uppercase; color: #fff; } .dopt span { display: block; font-size: 12.5px; color: var(--mut); }
  #btn-start { margin-top: 18px; width: 100%; height: 46px; background: var(--red); border: 0; border-radius: 3px; color: #fff; font: 700 17px var(--cond); letter-spacing: .25em; cursor: pointer; } #btn-start:hover { background: #e24a54; } #btn-start:disabled { opacity: .5; }
  #menu-note { margin-top: 10px; color: var(--mut); font-size: 12.5px; text-align: center; } #menu-err { color: #ff8a93; text-align: center; min-height: 18px; margin-top: 6px; }

  #end .sheet { width: min(460px, 100%); padding: 28px; text-align: center; }
  #end h2 { margin: 0 0 6px; font: 700 44px var(--cond); letter-spacing: .2em; } #end.victory h2 { color: var(--green); } #end.defeat h2 { color: var(--red); }
  #end p { color: #b9c6d4; margin: 0 0 18px; }
  .endgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; } .endgrid div { padding: 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 12px; color: var(--mut); } .endgrid b { display: block; font: 600 20px var(--cond); color: #fff; }

  #toast { position: fixed; left: 50%; bottom: calc(var(--bar) + 14px); transform: translate(-50%, 10px); z-index: 1200; max-width: min(520px, 92vw); padding: 9px 14px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.err { border-left-color: var(--red); }
  #building { position: fixed; left: 58px; top: 64px; z-index: 1000; padding: 4px 10px; font-size: 12px; color: var(--mut); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }

  /* ---------- popups ---------- */
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .leaflet-popup-tip { background: var(--panel); border: 1px solid var(--line); }
  .leaflet-popup-close-button { color: var(--mut) !important; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; min-width: 220px; }
  .pp h3 { margin: 0; font: 700 18px/1.2 var(--cond); color: #fff; letter-spacing: .02em; }
  .pp .sub { color: var(--mut); font-size: 12px; margin-bottom: 6px; }
  .pp .kv { padding: 2px 0; }
  .pp .btns { display: grid; gap: 6px; margin-top: 10px; }
  .pp .btn { height: 30px; font-size: 12.5px; text-align: left; padding: 0 10px; }
  .pp .warn { font-size: 12px; color: #ffb3b8; background: #2a1519; border: 1px solid #5a1d23; padding: 6px 8px; margin-top: 8px; border-radius: 3px; }
  .pp .small { font-size: 11.5px; color: var(--mut); }


  /* ---------- atmosphere: the world decays ---------- */
  #atmo { position: fixed; inset: 0; z-index: 900; pointer-events: none; }
  #ash { position: absolute; inset: 0; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,calc(.3 + var(--decay, 0) * .45)) 100%);
    box-shadow: inset 0 0 calc(60px + var(--decay, 0) * 160px) rgba(130,12,22,calc(var(--decay, 0) * .4)); }
  #flash { position: absolute; inset: 0; opacity: 0; }
  .leaflet-overlay-pane, .leaflet-cells-pane { filter: saturate(calc(1 - var(--decay, 0) * .6)) brightness(calc(1 - var(--decay, 0) * .2)); }

  /* ---------- day bar, phase, channels, sound ---------- */
  #date { position: relative; }
  #dayprog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--red); }
  #snd { width: 34px; height: 34px; margin: auto 4px; display: grid; place-items: center; background: none; border: 0; color: var(--mut); cursor: pointer; border-radius: 3px; }
  #snd:hover { color: #fff; background: var(--panel2); } #snd.off { opacity: .4; } #snd svg { width: 16px; height: 16px; }
  .chan { display: flex; gap: 3px; }
  .chan button { width: 34px; height: 34px; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; color: #9fb2c6; cursor: pointer; padding: 0; }
  .chan button:hover { border-color: #34495f; color: #fff; }
  .chan button.on { color: #ff9aa0; border-color: var(--red); background: #2a1519; }
  .chan svg { width: 15px; height: 15px; }
  .ph2 { color: #e0a23a !important; } .ph3 { color: #e0592a !important; } .ph4 { color: #d4343e !important; }

  /* ---------- decisions and chronicle cards ---------- */
  #ev { z-index: 1500; background: radial-gradient(ellipse at 50% 30%, rgba(26,9,12,.94), rgba(3,5,8,.98) 70%); transition: opacity .4s; }
  .evbox { width: min(680px, 100%); text-align: center; }
  .ev-meta { display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--line); font: 600 12px var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--mut); }
  .ev-emblem { width: 70px; height: 70px; margin: 26px auto 8px; color: var(--red); }
  #ev.m-fire .ev-emblem { color: #e0592a; } #ev.m-shield .ev-emblem { color: #3d7fe0; } #ev.m-crown .ev-emblem { color: var(--gold); }
  #ev.m-flask .ev-emblem { color: #4cc3d9; } #ev.m-wave .ev-emblem { color: #4ca0d9; } #ev.m-skull .ev-emblem { color: #c9c9c9; }
  #ev-title { margin: 4px 0 16px; font: 700 48px/1.05 var(--cond); letter-spacing: .09em; text-transform: uppercase; color: #fff; }
  #ev-text { min-height: 96px; margin: 0 auto 16px; max-width: 560px; font: italic 400 19px/1.6 "Source Serif 4", Georgia, serif; color: #cfd8e3; cursor: pointer; }
  #ev-choices { text-align: left; }
  .evc { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px; background: #0d151e; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
  .evc:hover:not(:disabled), .evc:focus-visible { border-color: #fff; background: #13202c; outline: 0; }
  .evc:disabled { opacity: .4; cursor: not-allowed; }
  .evc .n { font: 700 16px var(--cond); color: var(--red); } .evc .lab { color: #fff; font-weight: 500; }
  .evc .cost { font: 600 15px var(--cond); color: var(--gold); } .evc small { grid-column: 2 / -1; font-size: 12.5px; color: var(--mut); }
  #ev.k-card .evc { text-align: center; grid-template-columns: 1fr; } #ev.k-card .evc .n { display: none; }


  /* ---------- bar fix, top-right buttons ---------- */
  #bar { overflow-x: auto; overflow-y: hidden; gap: 18px; }
  .st { flex: none; }
  #st-dis { cursor: pointer; } #st-dis:hover .v { color: #ff9aa0; }
  #topr { position: fixed; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 6px; }
  #topr .btn { height: 36px; background: var(--panel); }
  @media (max-width: 1250px) { #bar { gap: 12px; padding: 0 10px; } #bar .btn { padding: 0 9px; font-size: 12px; } .meter { width: 64px; } }

  /* ---------- difficulty, continue ---------- */
  .menu h2.sp { margin-top: 18px; }
  .diffs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dif { padding: 9px 4px; text-align: center; background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font: 600 15px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  .dif:hover { background: var(--panel); color: #fff; } .dif[aria-pressed=true] { color: #fff; background: #1d1519; border-color: var(--red); }
  .dif.d-casual[aria-pressed=true] { border-color: var(--green); background: #101e18; } .dif.d-hard[aria-pressed=true] { border-color: var(--amber); background: #221a10; } .dif.d-super[aria-pressed=true] { background: #2a1014; }

  .camp-ring { width: 26px; height: 26px; border: 2px solid var(--red); border-radius: 50%; animation: campring 1.6s ease-out infinite; }
  @keyframes campring { from { transform: scale(.5); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }

  .sheet.tree { width: min(1000px, 100%); overflow-y: auto; }
  .ttabs { display: flex; border-bottom: 1px solid var(--line); }
  .ttabs button { flex: 1; padding: 11px 4px; background: none; border: 0; border-bottom: 3px solid transparent; font: 600 14px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .ttabs button:hover { color: #fff; } .ttabs button.on { color: #fff; border-bottom-color: var(--acc); }
  .ttabs svg { width: 16px; height: 16px; fill: none; stroke: var(--acc); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; } .ttabs em { font-style: normal; font-size: 12px; color: var(--mut); }
  .graph { position: relative; height: 330px; margin: 12px 18px 0; background: radial-gradient(ellipse at 50% 50%, #13212f, #0a131c 72%); border: 1px solid var(--line); border-radius: 3px; }
  #tlines { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tlines line { stroke: #2a4157; stroke-width: 2; vector-effect: non-scaling-stroke; } #tlines line.built { stroke: var(--acc); stroke-width: 3; }
  .tn { position: absolute; width: 58px; height: 58px; transform: translate(-50%, -50%); border-radius: 50%; background: #0d1721; border: 2px solid #2c4057; color: #6f8399; display: grid; place-items: center; cursor: pointer; padding: 0; font: 700 19px var(--cond); }
  .tn.branch { width: 46px; height: 46px; }
  .tn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tn:hover { color: #fff; border-color: #5a7590; }
  .tn.built { background: var(--acc); border-color: #fff; color: #06101a; box-shadow: 0 0 16px var(--acc); }
  .tn.avail { border-color: var(--gold); color: var(--gold); animation: availp 1.8s infinite; }
  @keyframes availp { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,169,58,0); } 50% { box-shadow: 0 0 0 7px rgba(217,169,58,.2); } }
  .tn.blocked { border-style: dashed; border-color: #7d1d24; color: #7d1d24; opacity: .65; }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script>
(function () {
  "use strict";

  const WORLD_URLS = [
    "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json",
    "https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json",
    "/data/world.geo.json"
  ];
  const SPEEDS = [null, { ms: 25000, days: 1 }, { ms: 5000, days: 1 }, { ms: 1000, days: 1 }, { ms: 1400, days: 7 }];   // 1x = one day every 25 seconds
  const DISEASES = [
    { id: "bacteria", name: "Bacteria", text: "Patient and hardy. Travels well by sea." },
    { id: "virus", name: "Virus", text: "Mutates fast and rides every flight. The cure takes longer." },
    { id: "zombie", name: "Zombie", text: "Marches over land and kills hard. Weak in the air." },
    { id: "random", name: "Random", text: "You find out when patient zero appears." }
  ];
  const PLANE = '<svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 0.5l1.1 5.3 5.4 3v1.7l-5.4-1.5-.5 3.4 1.9 1.4v1.2L8 14.5l-2.5.5v-1.2l1.9-1.4-.5-3.4-5.4 1.5V8.8l5.4-3z"/></svg>';
  const SHIP = '<svg viewBox="0 0 16 16"><path fill="currentColor" d="M7 1h2v3h3v3H4V4h3zM1.5 8.5h13L12.5 14h-9z"/></svg>';

  // ======================= helpers =======================
  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  const fmt = function (n) { return Math.round(Number(n || 0)).toLocaleString("en-US"); };
  const pct = function (x, d) { return Number((x * 100).toFixed(d == null ? 1 : d)); };
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function parseDate(iso) { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtDate(iso, withDay) {
    const d = parseDate(iso);
    const s = d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    return withDay ? d.toLocaleDateString("en-GB", { weekday: "short" }) + " " + s : s;
  }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function toast(msg, err) {
    const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, err ? 4200 : 2800);
  }

  // ======================= state =======================
  let S = null;                       // latest full + merged state
  let NEWS = [];                      // newest first
  let unread = 0, busy = false, speed = 0, timer = null, gen = 0, lastTurn = 0, endShown = false;
  let menuCountries = [], selCountry = null, selDisease = "random";
  const C = {}, C3 = {}, shapes = {}, R = {};          // countries by id / iso3, country shapes, regions by id
  const cells = {}, dots = {}, icons = {}, failed = {}, styleKey = {}, campMk = {};
  let worldReady = Promise.resolve();

  function indexCountries(list) {
    list.forEach(function (c) { C[c.id] = Object.assign(C[c.id] || {}, c); if (C[c.id].iso3) C3[C[c.id].iso3] = C[c.id]; });
  }
  const cname = function (id) { return C[id] ? C[id].name : id; };
  const me = function () { return S && S.player_country; };

  // ======================= map =======================
  const map = L.map("map", { center: [30, 15], zoom: 2.5, minZoom: 2, maxZoom: 8, zoomSnap: 0.5, maxBounds: [[-85, -190], [85, 190]], maxBoundsViscosity: 1.0, worldCopyJump: false });
  map.attributionControl.addAttribution("World borders: johan/world.geo.json");
  [["cells", 430], ["dots", 460], ["icons", 470], ["traffic", 480]].forEach(function (p) { map.createPane(p[0]); map.getPane(p[0]).style.zIndex = p[1]; });
  ["icons", "traffic"].forEach(function (n) { map.getPane(n).style.pointerEvents = "none"; });
  function zoomClass() { const z = map.getZoom(), c = map.getContainer(); c.classList.toggle("z-s", z < 3.5); renderIcons(); }
  map.on("zoomend", zoomClass);

  const BASE = { fillColor: "#1a2634", fillOpacity: 1, color: "#0c1722", weight: 0.8 };
  async function loadWorld() {
    for (const url of WORLD_URLS) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const geo = await res.json();
        geo.features.forEach(function (f) { if (f.id) shapes[f.id] = f; });
        L.geoJSON(geo, {
          style: BASE,
          onEachFeature: function (f, layer) {
            layer.on("mouseover", function () { layer.setStyle({ fillColor: "#223244" }); });
            layer.on("mouseout", function () { layer.setStyle(BASE); });
            layer.on("click", function (e) {
              const c = C3[f.id];
              L.popup({ closeButton: false }).setLatLng(e.latlng)
                .setContent('<div class="pp"><h3>' + esc(c ? c.name : (f.properties && f.properties.name) || "Unknown") + '</h3><div class="sub">Capital: ' + esc(c && c.capital_name ? c.capital_name : "Unknown") + "</div></div>").openOn(map);
            });
          }
        }).addTo(map);
        return;
      } catch (e) { /* next source */ }
    }
    toast("Could not load the world map.", true);
  }

  // ======================= region cells: Voronoi clipped to the real border =======================
  function toLatLngs(g) {
    const f = function (r) { return r.map(function (p) { return [p[1], p[0]]; }); };
    return g.type === "Polygon" ? g.coordinates.map(f) : g.coordinates.map(function (poly) { return poly.map(f); });
  }
  function mapLng(g, fn) {
    const f = function (c) { return [fn(c[0]), c[1]]; };
    return g.type === "Polygon" ? { type: "Polygon", coordinates: g.coordinates.map(function (r) { return r.map(f); }) }
      : { type: "MultiPolygon", coordinates: g.coordinates.map(function (p) { return p.map(function (r) { return r.map(f); }); }) };
  }
  function lngRange(g) {
    let a = 999, b = -999;
    (g.type === "Polygon" ? [g.coordinates] : g.coordinates).forEach(function (p) { p[0].forEach(function (c) { if (c[0] < a) a = c[0]; if (c[0] > b) b = c[0]; }); });
    return [a, b];
  }
  function splitAnti(feat) {
    const polys = [];
    const add = function (g, dx) {
      if (!g) return;
      (g.type === "Polygon" ? [g.coordinates] : g.coordinates).forEach(function (p) { polys.push(p.map(function (r) { return r.map(function (c) { return [c[0] + dx, c[1]]; }); })); });
    };
    const w = turf.intersect(feat, turf.bboxPolygon([0, -90, 180, 90])), e = turf.intersect(feat, turf.bboxPolygon([180, -90, 540, 90]));
    add(w && w.geometry, 0); add(e && e.geometry, -360);
    return { type: "MultiPolygon", coordinates: polys };
  }
  function countryCells(shape, regs) {
    const out = {};
    if (regs.length === 1) { out[regs[0].id] = shape.geometry; return out; }
    const rg = lngRange(shape.geometry), wrap = rg[0] < -150 && rg[1] > 150;
    const sh = wrap ? function (x) { return x < 0 ? x + 360 : x; } : function (x) { return x; };
    const feat = { type: "Feature", properties: {}, geometry: wrap ? mapLng(shape.geometry, sh) : shape.geometry };
    const pts = turf.featureCollection(regs.map(function (r) { return turf.point([sh(r.lng), r.lat], { id: r.id }); }));
    const bb = turf.bbox(feat);
    const vor = turf.voronoi(pts, { bbox: [bb[0] - 1, bb[1] - 1, bb[2] + 1, bb[3] + 1] });
    vor.features.forEach(function (cell, i) {
      if (!cell) return;
      const it = turf.intersect(cell, feat);
      if (it) out[pts.features[i].properties.id] = wrap ? splitAnti(it) : it.geometry;
    });
    return Object.keys(out).length ? out : null;
  }

  function cellStyle(r, hover) {
    const owner = r.owner, mine = owner === me();
    let color = "#e6f1ff", weight = 0.7, opacity = hover ? 0.7 : 0.16, dash = null, fill = "#ffffff", fo = hover ? 0.08 : 0.01;
    const c = C[owner];
    if (mine) { color = "#3d7fe0"; weight = 1.6; opacity = 0.95; fill = "#3d7fe0"; fo = hover ? 0.18 : 0.07; }
    else if (c && c.war) { color = "#d4343e"; weight = 1.2; opacity = 0.8; }
    else if (c && c.ally) { color = "#3f9f6f"; weight = 1.2; opacity = 0.8; }
    else if (c && c.trade) { color = "#6b9fe0"; opacity = 0.5; }
    if (r.lockdown) { dash = r.lockdown === 2 ? "2 3" : "5 4"; color = r.lockdown === 2 ? "#d4343e" : "#d88a2a"; weight = 1.6; opacity = 0.95; }
    if (r.dead > 0.08) { fill = "#000000"; fo = Math.max(fo, Math.min(0.8, r.dead * 0.95)); }            // the dead zones go dark
    else if (r.infection > 0.15) { fill = "#d4343e"; fo = Math.max(fo, Math.min(0.15, r.infection * 0.15)); }
    return { color: color, weight: weight, opacity: opacity, dashArray: dash, fillColor: fill, fillOpacity: fo };
  }
  function buildCells() {
    const my = gen, groups = {};
    S.regions.forEach(function (r) { (groups[r.country_id] = groups[r.country_id] || []).push(r); });
    const ids = Object.keys(groups);
    let i = 0;
    $("building").classList.remove("hidden");
    (function step() {
      if (my !== gen) return;
      for (const stop = Math.min(ids.length, i + 8); i < stop; i++) {
        const cid = ids[i], regs = groups[cid], c = C[cid], shape = c && shapes[c.iso3];
        let out = null;
        try { if (shape && window.turf) out = countryCells(shape, regs); } catch (e) { out = null; }
        if (!out) { failed[cid] = true; continue; }
        regs.forEach(function (r) {
          if (!out[r.id]) return;
          const layer = L.polygon(toLatLngs(out[r.id]), Object.assign({ pane: "cells", bubblingMouseEvents: false, smoothFactor: 0.5, lineJoin: "round" }, cellStyle(r, false)));
          layer.on("click", function (e) { openRegion(r.id, e.latlng); });

  // ======================= moving planes and ships =======================
  function norm(l) { return ((l + 540) % 360) - 180; }
  function travel(t) {
    if (reduced) return;
    const sea = t.kind === "sea" && t.path && t.path.length > 1;
    let pts;
    if (sea) pts = t.path.slice();
    else {
      const a = t.from; let bl = t.to[1];
      if (Math.abs(bl - a[1]) > 180) bl += a[1] > bl ? 360 : -360;
      const lift = Math.min(14, Math.hypot(bl - a[1], t.to[0] - a[0]) * 0.18), N = 24;
      pts = [];
      for (let i = 0; i <= N; i++) { const k = i / N; pts.push([(1 - k) * (1 - k) * a[0] + 2 * (1 - k) * k * ((a[0] + t.to[0]) / 2 + lift) + k * k * t.to[0], (1 - k) * a[1] + k * bl]); }
    }
    const lens = [0];
    for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = lens[lens.length - 1] || 1, dur = sea ? Math.min(5200, 1800 + total * 55) : 1400, endK = t.blocked ? 0.6 : 1;
    const mk = L.marker(pts[0], { pane: "traffic", interactive: false, icon: L.divIcon({ className: "", html: '<div class="mv ' + (sea ? "sea" : "") + '">' + (sea ? SHIP : PLANE) + "</div>", iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
    let trail = L.polyline([norm2(pts[0])], { pane: "traffic", color: sea ? "#7fc4e6" : "#d4343e", weight: 1, opacity: 0.7, interactive: false }).addTo(map);
    const trails = [trail], t0 = performance.now();
    function norm2(p) { return [p[0], norm(p[1])]; }
    let lastPos = pts[0], seg_i = 1;
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur) * endK, d = k * total;
      while (seg_i < pts.length - 1 && lens[seg_i] < d) seg_i++;
      const a = pts[seg_i - 1], b = pts[seg_i], u = (d - lens[seg_i - 1]) / ((lens[seg_i] - lens[seg_i - 1]) || 1);
      const pos = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
      mk.setLatLng(norm2(pos));
      const e = mk.getElement(), prevPos = lastPos;
      if (e && e.firstChild && e.firstChild.firstChild && (pos[0] !== prevPos[0] || pos[1] !== prevPos[1])) e.firstChild.firstChild.style.transform = "rotate(" + (Math.atan2((pos[1] - prevPos[1]) * Math.cos(pos[0] * Math.PI / 180), pos[0] - prevPos[0]) * 180 / Math.PI) + "deg)";
      lastPos = pos;
      if (Math.abs(norm(pos[1]) - norm(prevPos[1])) > 180) { trail = L.polyline([], { pane: "traffic", color: sea ? "#7fc4e6" : "#d4343e", weight: 1, opacity: 0.7, interactive: false }).addTo(map); trails.push(trail); }
      trail.addLatLng(norm2(pos));
      if (now - t0 < dur) return requestAnimationFrame(step);
      map.removeLayer(mk);
      const fx = L.marker(norm2(pos), { pane: "traffic", interactive: false, icon: L.divIcon({ className: "", html: '<div class="ring ' + (t.blocked ? "stop" : "") + '"></div>', iconSize: [10, 10], iconAnchor: [5, 5] }) }).addTo(map);
      setTimeout(function () { map.removeLayer(fx); trails.forEach(function (x) { map.removeLayer(x); }); }, 1000);
    })(t0);
  }
  function animateTraffic(list) { (list || []).slice(0, 12).forEach(function (t, i) { setTimeout(function () { travel(t); }, i * 160); }); }

  function sndUpdate(d) {
    if (!SND.ctx || !SND.on) return;
    const t = SND.ctx.currentTime;
    SND.filter.frequency.setTargetAtTime(180 + d * 700, t, 2);
    SND.dg.gain.setTargetAtTime(0.05 + d * 0.10, t, 2);
  }
  let beatAt = 0;
  function thump(t, g) {
    const c = SND.ctx, o = c.createOscillator(), a = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.16);
    a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g, t + 0.02); a.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(a); a.connect(SND.master); o.start(t); o.stop(t + 0.25);
  }
  function heartbeat() {
    if (!SND.ctx || !SND.on || decay < 0.12 || document.hidden) return;
    const now = SND.ctx.currentTime; if (now < beatAt) return;
    beatAt = now + 1.4 - decay * 0.8; thump(now, 0.18 + decay * 0.25); thump(now + 0.2, 0.12 + decay * 0.18);
  }
  function sting(kind) {
    if (!SND.ctx || !SND.on) return;
    const c = SND.ctx, t = c.currentTime, o = c.createOscillator(), a = c.createGain();
    o.type = "triangle";
    const f = kind === "card" ? [196, 147] : [130, 87];
    o.frequency.setValueAtTime(f[0], t); o.frequency.exponentialRampToValueAtTime(f[1], t + 1.2);
    a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(0.22, t + 0.05); a.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    o.connect(a); a.connect(SND.master); o.start(t); o.stop(t + 1.6);
  }
  function sndToggle() {
    SND.on = !SND.on;
    try { window.localStorage.setItem("outbreak-sound", SND.on ? "1" : "0"); } catch (e) { /* ignore */ }
    if (SND.on) { if (!SND.ctx) sndStart(); else if (SND.ctx.resume) SND.ctx.resume(); } else if (SND.ctx && SND.ctx.suspend) SND.ctx.suspend();
    $("snd").classList.toggle("off", !SND.on);
  }
  $("snd").classList.toggle("off", !SND.on);

  // ======================= decisions and chronicle cards =======================
  const EMBLEM = {
    outbreak: '<circle cx="32" cy="32" r="10"/><path d="M32 8v12M32 44v12M8 32h12M44 32h12M15 15l8 8M41 41l8 8M49 15l-8 8M23 41l-8 8"/><circle cx="32" cy="7" r="2.6"/><circle cx="32" cy="57" r="2.6"/><circle cx="7" cy="32" r="2.6"/><circle cx="57" cy="32" r="2.6"/>',
    fire: '<path d="M32 6c3 10 14 14 14 28a14 14 0 01-28 0c0-8 4-11 7-16 1 5 4 7 7 7-2-6-2-13 0-19z"/>',
    shield: '<path d="M32 6l20 8v14c0 14-9 25-20 30-11-5-20-16-20-30V14z"/><path d="M32 22v20M22 32h20"/>',
    crown: '<path d="M8 46l4-26 14 14 6-18 6 18 14-14 4 26z"/><path d="M10 54h44"/>',
    flask: '<path d="M24 6h16M27 6v18L10 52a4 4 0 004 6h36a4 4 0 004-6L37 24V6"/><path d="M18 42h28"/>',
    wave: '<path d="M6 20q6-8 13 0t13 0t13 0t13 0M6 34q6-8 13 0t13 0t13 0t13 0M6 48q6-8 13 0t13 0t13 0t13 0"/>',
    skull: '<path d="M32 6c-13 0-22 8-22 20 0 7 4 11 8 14v10h8v-5h4v5h8v-5h4v5h8V40c4-3 8-7 8-14C54 14 45 6 32 6z"/><circle cx="23" cy="28" r="5"/><circle cx="41" cy="28" r="5"/>'
  };
  function emblem(m) { return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">' + (EMBLEM[m] || EMBLEM.skull) + "</svg>"; }

  let evUid = null, evPending = null, typeT = null;
  function skipType() { if (typeT) { clearInterval(typeT); typeT = null; $("ev-text").textContent = evPending.text; revealChoices(evPending); } }
  function showEvent(p) {
    if (evUid === p.uid) return;
    evUid = p.uid; evPending = p; setSpeed(0);
    $("ev").className = "ov open m-" + p.mood + " k-" + p.kind;
    $("ev-date").textContent = fmtDate(S.date, true) + " · day " + S.day;
    $("ev-kind").textContent = p.kind === "card" ? "Chronicle" : "Decision" + (p.queued ? " · " + p.queued + " more waiting" : "");
    $("ev-emblem").innerHTML = emblem(p.mood);
    $("ev-title").textContent = p.title;
    const box = $("ev-choices"); box.innerHTML = ""; box.classList.add("hidden");
    const txt = $("ev-text"); txt.textContent = ""; clearInterval(typeT); typeT = null;
    txt.onclick = skipType;
    sndStart(); sting(p.kind === "card" ? "card" : "bad");
    if (reduced) { txt.textContent = p.text; revealChoices(p); return; }
    let i = 0;
    typeT = setInterval(function () { i += 2; txt.textContent = p.text.slice(0, i); if (i >= p.text.length) skipType(); }, 22);
  }
  function revealChoices(p) {
    const box = $("ev-choices"); box.innerHTML = ""; box.classList.remove("hidden");
    p.choices.forEach(function (c) {
      const b = el("button", "evc", '<span class="n">' + (c.i + 1) + '</span><span class="lab">' + esc(c.label) + "</span>" + (c.cost ? '<span class="cost">$' + c.cost + "</span>" : "<span></span>") + (c.hint ? "<small>" + esc(c.hint) + "</small>" : ""));
      b.disabled = !c.can; if (!c.can) b.title = "You cannot afford this";
      b.addEventListener("click", function () { chooseEvent(c.i); });
      box.appendChild(b);
    });
    const first = box.querySelector("button:not(:disabled)"); if (first) first.focus();
  }
  async function chooseEvent(i) {
    if (busy) return;
    await post({ action: "choose", index: i });
  }
  function syncEvent() {
    if (S && S.pending) {
      if (evUid !== S.pending.uid) {
        const p = S.pending;
        setTimeout(function () { if (S && S.pending && S.pending.uid === p.uid) showEvent(p); }, evUid === null ? 0 : 400);
      }
    } else if (evUid !== null) {
      evUid = null; evPending = null; clearInterval(typeT); typeT = null; $("ev").classList.remove("open");
    }
  }

  // ======================= disease dossier =======================
  const PHASE_TEXT = { 1: "A few clusters. The world has not noticed yet.", 2: "Several countries are fighting it. Borders are closing.", 3: "On every continent. Travel is collapsing.", 4: "Governments are failing. The dead outnumber what anyone can count." };
  function renderDisease() {
    const pane = $("pane-dis"); if (!S) return;
    const kv = function (k, v) { return '<div class="kv">' + k + "<b>" + v + "</b></div>"; };
    pane.innerHTML = kv("Pathogen", esc(S.disease_name) + " (" + esc(S.disease) + ")") + kv("Difficulty", esc(S.difficulty_label)) + kv("Phase", S.phase + " of 4 · " + esc(S.phase_name)) +
      '<div class="hint" style="margin:4px 0 8px">' + esc(PHASE_TEXT[S.phase]) + "</div>" +
      kv("Countries infected", S.infected_countries) + kv("World infected", pct(S.world_infected, 1) + "%") + kv("Dead worldwide", fmt(S.world_dead)) + kv("Nations fallen", S.fallen) +
      kv("Cure", S.cure_started ? pct(S.cure_progress, 1) + "%" : "not started");
    pane.appendChild(el("h4", null, "Mutations"));
    if (!S.mutations.length) pane.appendChild(el("div", "hint", "None yet. A new one appears every two or three months."));
    S.mutations.forEach(function (m) { pane.appendChild(el("div", "news-item imp", "<b>" + esc(m.name) + "</b><br>" + esc(m.text))); });
    pane.appendChild(el("h4", null, "Your active decisions"));
    if (!S.mods.length) pane.appendChild(el("div", "hint", "None."));
    S.mods.forEach(function (m) { pane.appendChild(el("div", "news-item", "<b>" + esc(m.name) + "</b> · " + m.days + " days left<br>" + esc(m.text))); });
  }

  // ======================= boot =======================
  worldReady = loadWorld();
  api("/api/state", { cache: "no-store" }).then(function (res) {
    const s = res.data;
    if (s.started) { buildMenu(s.countries, s); enter(s); } else buildMenu(s.countries, s);
  }).catch(function () { $("menu-err").textContent = "Cannot reach the server. Is app.py running?"; });
})();
</script>
